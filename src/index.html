<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Retro Shaders</title>
    <meta name='description' content='Retro Shaders'>
    <link rel="stylesheet" href="./style.css">
    <link rel='shortcut icon' type='image/png' href='/icon.png' />
    <script type="module" src="./script.js"></script>
</head>

<body>
    <canvas class="webgl"></canvas>

    <nav class="selector" aria-label="Choix de la scène">
        <button type="button" class="selector__button" id="previous" aria-label="Scène précédente">‹</button>
        <div class="selector__center">
            <div class="selector__title" id="title" aria-live="polite"></div>
            <div class="selector__dots" id="dots"></div>
        </div>
        <button type="button" class="selector__button" id="next" aria-label="Scène suivante">›</button>
    </nav>

    <button type="button" class="terminal-toggle" id="terminal-toggle" aria-controls="terminal"
        aria-expanded="true">[-]fermer</button>

    <aside class="terminal" id="terminal" aria-label="Terminal de réglages">
        <div class="terminal__body" id="terminal-body"></div>
        <footer class="terminal__footer">H : ouvrir / fermer · Échap : fermer</footer>
    </aside>
</body>

</html>
